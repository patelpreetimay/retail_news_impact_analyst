# Categories
#   sectors          — broad GICS-ish industry words
#   regulators       — global + India regulator / policy bodies
#   indices          — major equity / commodity indices
#   india_companies  — top NSE/BSE issuers (~120 names)
#   global_companies — top global tickers / mega-caps (~80 names)
#   event_keywords   — generic financial-event vocabulary
#   macro_keywords   — macroeconomic / geopolitical signals
# ----------------------------------------------------------------------------

