# ----------------------------------------------------------------------------
# Curated relevance vocabulary for the deterministic Stage-1 keyword filter.
#
# An article is RELEVANT if it mentions ANY term from any list below
# (case-insensitive, whole-word match for short tokens; substring for
# multi-word phrases).  Loaded by pipeline/run.py._load_keyword_pattern().
